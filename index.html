<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moises Osio — Product Designer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #111;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 340px;
      min-width: 280px;
      padding: 48px 40px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #e5e7eb;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .avatar__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sidebar__name {
      font-size: 24px;
      font-weight: 600;
      color: #111;
      margin-bottom: 10px;
    }

    .sidebar__title {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: #000;
      margin-bottom: 20px;
    }

    .sidebar__tagline {
      font-size: 15px;
      line-height: 1.65;
      color: #444;
      margin-bottom: 28px;
    }

    .divider {
      border: none;
      border-top: 1px dashed #ccc;
      margin: 24px 0;
    }

    .focus-label {
      font-size: 13px;
      font-weight: 600;
      color: #111;
      margin-bottom: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      border: 1px solid #ccc;
      border-radius: 100px;
      padding: 4px 13px;
      font-size: 13px;
      color: #333;
    }

    /* Contact */
    .contact {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 14px;
      color: #333;
      text-decoration: none;
    }

    .contact-item svg {
      flex-shrink: 0;
      color: #555;
    }

    a.contact-item:hover { color: #000; }

    /* ── Main content ── */
    .content {
      margin-left: 340px;
      flex: 1;
      padding: 24px 56px 80px;
      min-height: 100vh;
    }

    /* ── Tabs ── */
    /* Sticky: 24px of the content's top padding lives here instead, so the
       resting position is unchanged and the stuck bar has breathing room. */
    .tabs {
      display: flex;
      gap: 24px;
      margin-bottom: 36px;
      padding-top: 24px;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      /* Side masks: hide the edge of a hovered card (scale 1.02 → ≤434px card
         grows ~4.3px per side) as it passes underneath. */
      box-shadow: -5px 0 0 #fff, 5px 0 0 #fff;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 0 0 14px;
      font-size: 15px;
      color: #888;
      cursor: pointer;
      font-family: inherit;
      font-weight: 400;
      transition: color 0.15s;
    }

    .tab-btn.active {
      color: #111;
      font-weight: 500;
    }

    .tabs__indicator {
      position: absolute;
      bottom: -1px;
      height: 2px;
      background: #111;
      pointer-events: none;
      transition: left 220ms cubic-bezier(.2,.8,.2,1), width 220ms cubic-bezier(.2,.8,.2,1);
    }

    @media (prefers-reduced-motion: reduce) {
      .tabs__indicator { transition: none; }
    }

    /* ── Entrance animations ── */
    @keyframes home-reveal {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .content { animation: home-reveal 0.7s ease both; }

    @keyframes tab-reveal {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .panel.is-entering { animation: tab-reveal 0.45s ease both; }

    @media (prefers-reduced-motion: reduce) {
      .content { animation: none; }
      .panel.is-entering { animation: none; }
    }

    /* ── Panels ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Work grid ── */
    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 434px));
      gap: 32px;
    }

    .project-card {
      border-radius: 10px;
      overflow: hidden;
      background: #f7f7f7;
      position: relative;
      display: block;
      text-decoration: none;
      transition: transform 0.3s ease;
    }

    .project-card:hover {
      transform: scale(1.02);
    }

    .project-card__draft-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #fef08a;
      color: #713f12;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      z-index: 2;
      pointer-events: none;
    }

    .project-card__image {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #e5e7eb;
      background-image:
        linear-gradient(45deg, #d1d5db 25%, transparent 25%),
        linear-gradient(-45deg, #d1d5db 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #d1d5db 75%),
        linear-gradient(-45deg, transparent 75%, #d1d5db 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      overflow: hidden;
    }

    .project-card__image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-card__hover-bg {
      position: absolute;
      inset: 0;
      background: var(--hover-bg, #111111);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .project-card:hover .project-card__hover-bg {
      opacity: 1;
    }

    .project-card__body {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 22px 24px;
      background: linear-gradient(to top, rgba(10,10,10,0.88) 0%, rgba(10,10,10,0.45) 55%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .project-card:hover .project-card__body {
      opacity: 1;
    }

    .project-card__title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.35;
      max-width: 92%;
      text-wrap: balance;
    }

    .project-card__subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .project-card__link {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* ── About ── */
    .about-heading {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: -0.02em;
    }

    .about-body p {
      font-size: 17px;
      line-height: 1.75;
      color: #333;
      margin-bottom: 20px;
      max-width: 640px;
      /* Preserve line breaks typed in the editor's paragraph textarea,
         without requiring manual <br> tags — same technique already used
         for case-study/article paragraphs (see .cs-prose p.cs-paragraph
         in style.css). */
      white-space: pre-line;
    }

    /* ── Career timeline ──
       Mobile-first stacked list; switches to the two-column bar chart based on
       the timeline's own width (container query), not the viewport, so the
       fixed sidebar is accounted for automatically. */
    .timeline {
      container: timeline / inline-size;
      width: 100%;
      max-width: 1100px;   /* keeps years/bars from spreading too far on large monitors; left-aligned with the intro */
      margin-top: 36px;
      padding-top: 48px;
      border-top: 1px solid #e5e7eb;
      --tl-muted: #6b6b6b;
      --tl-line: #e5e7eb;
    }

    .timeline__heading {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #111;
    }

    .timeline__subtitle {
      font-size: 17px;
      line-height: 1.6;
      color: #555;
      margin-top: 6px;
    }

    .tl-chart { position: relative; margin-top: 40px; }
    .tl-axis, .tl-guides { display: none; }

    .tl-list { list-style: none; }

    .tl-row {
      border-left: 3px solid var(--tl-color);
      padding: 2px 0 2px 14px;
      margin-bottom: 24px;
    }

    .tl-row__company {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      color: #111;
    }

    .tl-row__role {
      font-size: 14.5px;
      line-height: 1.5;
      color: #444;
    }

    .tl-row__meta {
      font-size: 13px;
      line-height: 1.6;
      color: var(--tl-muted);
      font-variant-numeric: tabular-nums;
    }

    .tl-row__desc {
      font-size: 14px;
      line-height: 1.6;
      color: #555;
      margin-top: 6px;
      max-width: 52ch;
    }

    .tl-row__track { display: none; }

    /* Visually hidden, still read by screen readers */
    .tl-sr {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .tl-mentoring {
      margin-top: 32px;
      padding: 24px 0;
      border-top: 1px solid var(--tl-line);
      border-bottom: 1px solid var(--tl-line);
    }

    .tl-mentoring__heading {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      color: #111;
    }

    .tl-legend {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
      margin-top: 24px;
      font-size: 14px;
      color: #444;
    }

    .tl-legend li { display: inline-flex; align-items: center; gap: 10px; }

    .tl-legend__dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Two-column chart: labels left, bars on a shared year axis right */
    @container timeline (min-width: 520px) {
      .tl-chart {
        --tl-label: clamp(200px, 40cqi, 280px);
        --tl-gap: clamp(16px, 3cqi, 32px);
        --tl-inset: 18px;   /* keeps centred year labels at the axis ends from clipping */
        --tl-axis-h: 28px;
      }

      .tl-axis {
        display: block;
        margin-left: calc(var(--tl-label) + var(--tl-gap));
        height: var(--tl-axis-h);
      }

      .tl-axis__plot,
      .tl-row__plot {
        position: relative;
        margin: 0 var(--tl-inset);
      }

      .tl-axis__plot { height: 100%; }

      .tl-tick {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        font-size: 12px;
        line-height: 1;
        color: var(--tl-muted);
      }

      .tl-guides {
        display: block;
        position: absolute;
        top: var(--tl-axis-h);
        bottom: 0;
        left: calc(var(--tl-label) + var(--tl-gap) + var(--tl-inset));
        right: var(--tl-inset);
        pointer-events: none;
      }

      .tl-guide {
        position: absolute;
        top: 0;
        bottom: 0;
        border-left: 1px dashed var(--tl-line);
      }

      .tl-list { position: relative; }   /* bars paint above the guides */

      .tl-row {
        display: grid;
        grid-template-columns: var(--tl-label) 1fr;
        column-gap: var(--tl-gap);
        border-left: none;
        padding: 0;
        margin-bottom: 26px;
      }

      /* Colour is carried by the bar here; the discipline name stays available
         to screen readers and in the bar's tooltip. */
      .tl-row__discipline {
        position: absolute;
        width: 1px; height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .tl-row__track { display: block; }

      /* Height of the company + role lines, so the bar sits beside them */
      .tl-row__plot { height: 45px; }

      .tl-bar {
        position: absolute;
        top: 50%;
        height: 16px;
        min-width: 6px;
        transform: translateY(-50%);
        border-radius: 4px;
        background: var(--tl-color);
        /* button reset — the bar is focusable so its tooltip works by keyboard */
        border: 0;
        padding: 0;
        margin: 0;
        font: inherit;
        cursor: default;
        -webkit-tap-highlight-color: transparent;
        /* Grows from its centre (top: 50% + translateY) — width/left are dates, never animated */
        transition: height 180ms ease-out, filter 180ms ease-out;
      }

      /* Fixed 30px hover/tap target centred on the bar; it doesn't grow with
         the bar, so the area under the pointer never changes (no flicker). */
      .tl-bar::before {
        content: '';
        position: absolute;
        top: 50%;
        left: -2px;
        right: -2px;
        height: 30px;
        transform: translateY(-50%);
      }

      /* Same feedback for mouse hover, keyboard focus, and the bar whose
         tooltip is open (tap on touch). Hover is limited to real pointers so a
         tapped bar doesn't stay highlighted after its tooltip closes. */
      .tl-bar:focus-visible,
      .tl-bar.is-active {
        height: 20px;
        filter: brightness(1.08) saturate(1.05);
      }

      @media (hover: hover) {
        .tl-bar:hover {
          height: 20px;
          filter: brightness(1.08) saturate(1.05);
        }
      }

      .tl-bar:focus-visible {
        outline: 2px solid #111;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .tl-bar { transition: none; }
      }

      /* In the chart the description lives in the bar's tooltip */
      .tl-row__desc { display: none; }
    }

    /* ── Timeline tooltip ──
       One shared element on <body> (position: fixed), filled from the hovered
       bar's hidden .tl-tip-content, so it can't be clipped by the content
       column or offset by its entrance-animation transform. */
    .tl-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 50;   /* above sticky tabs (10), below lightbox (1000) */
      width: min(320px, calc(100vw - 16px));
      padding: 12px 14px 13px;
      background: #161616;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      color: #fff;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(var(--tl-tip-shift, 4px));
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
    }

    .tl-tooltip.is-visible {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0s;
    }

    @media (prefers-reduced-motion: reduce) {
      .tl-tooltip, .tl-tooltip.is-visible { transition: none; transform: none; }
    }

    .tl-tip__meta {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.68);
    }

    .tl-tip__meta::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--tl-color);
      flex-shrink: 0;
    }

    .tl-tip__role {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      margin-top: 6px;
    }

    .tl-tip__company {
      font-size: 13px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.75);
    }

    .tl-tip__desc {
      font-size: 13px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.86);
      margin-top: 8px;
    }

    /* Narrow chart: every other year label/guide only */
    @container timeline (min-width: 520px) and (max-width: 679px) {
      .tl-tick:not(.tl-tick--sparse),
      .tl-guide:not(.tl-tick--sparse) { display: none; }
      .tl-row__company { font-size: 15px; }
      .tl-row__role { font-size: 13.5px; }
      .tl-row__plot { height: 43px; }
    }

    /* ── Publications ── */
    .publications-heading {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: -0.02em;
    }

    .publications-list {
      max-width: 900px;
    }

    .article {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding: 32px 0;
      border-bottom: 1px solid #e5e7eb;
      text-decoration: none;
      color: inherit;
    }

    .article:first-of-type { border-top: 1px solid #e5e7eb; }

    .article__body { flex: 1; }

    .article__title {
      font-size: 24px;
      font-weight: 700;
      color: #111;
      line-height: 1.4;
      margin-bottom: 10px;
      max-width: 480px;
      text-wrap: balance;
    }

    /* Date · read time — tertiary, sits between title and excerpt */
    .article__meta {
      font-size: 14px;
      color: #8a8a8a;
      margin-bottom: 10px;
    }

    .article__excerpt {
      font-size: 15px;
      color: #555;
      line-height: 1.65;
      margin-bottom: 16px;
      max-width: 520px;
    }

    .article__link {
      font-size: 14px;
      font-weight: 500;
      color: #3730a3;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      transition: gap var(--transition-fast);
    }

    .article:hover .article__link { gap: 0.65em; }

    .article__image {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .article__image-bg {
      width: 100%;
      height: 100%;
      background: #e5e7eb;
      transition: transform 0.5s ease;
    }

    .article__image-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .article__image:hover .article__image-bg { transform: scale(1.05); }

    /* ── Mobile: single-column layout ── */
    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
      }

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        overflow-y: visible;
        padding: 32px 24px 0;
      }

      .content {
        margin-left: 0;
        padding: 0 24px 64px;
      }

      .tabs {
        margin-top: 16px;
        padding-top: 24px;
        /* Full-width cards (≤720px here) grow up to ~7.2px per side on hover */
        box-shadow: -8px 0 0 #fff, 8px 0 0 #fff;
      }

      /* Prevent overflow on work grid */
      .work-grid {
        grid-template-columns: 1fr;
      }

      /* Publication rows: 80px thumb on left, text on right */
      .article {
        gap: 16px;
        justify-content: flex-start;
      }

      .article__image {
        order: -1;
        width: 80px;
        height: 80px;
        min-width: 80px;
        border-radius: 8px;
        align-self: flex-start;
      }

      .article__excerpt {
        max-width: none;
      }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="sidebar">

    <div class="avatar"></div>

    <p class="sidebar__name"></p>
    <h1 class="sidebar__title"></h1>
    <p class="sidebar__tagline"></p>

    <hr class="divider">

    <p class="focus-label">Focus:</p>
    <div class="tags" id="sidebar-tags"></div>

    <hr class="divider">

    <div class="contact" id="sidebar-contact"></div>

  </aside>

  <!-- ══════════ MAIN CONTENT ══════════ -->
  <main class="content">

    <!-- Tab nav -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="work">Selected work</button>
      <button class="tab-btn" data-tab="about">About me</button>
      <button class="tab-btn" data-tab="publications">Publications</button>
      <span class="tabs__indicator" aria-hidden="true"></span>
    </nav>

    <!-- ── Panel: Selected work ── -->
    <div class="panel active" id="panel-work">
      <div class="work-grid" id="work-grid"></div>
    </div>

    <!-- ── Panel: About me ── -->
    <div class="panel" id="panel-about">
      <h2 class="about-heading">About Me</h2>
      <div class="about-body" id="about-body"></div>
      <section class="timeline" id="about-timeline" aria-labelledby="timeline-heading" hidden></section>
    </div>

    <!-- ── Panel: Publications ── -->
    <div class="panel" id="panel-publications">
      <h2 class="publications-heading">Publications</h2>
      <div class="publications-list" id="publications-list"></div>
    </div>

  </main>
</div>

<script src="renderer.js"></script>
<script>
  /* Tab switching with sliding underline indicator */
  const tabs      = document.querySelectorAll('.tab-btn');
  const panels    = document.querySelectorAll('.panel');
  const indicator = document.querySelector('.tabs__indicator');
  const tabsNav   = document.querySelector('.tabs');
  let activeBtn   = document.querySelector('.tab-btn.active');

  function moveIndicator(btn) {
    const navRect = tabsNav.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    indicator.style.left  = (btnRect.left - navRect.left) + 'px';
    indicator.style.width = btnRect.width + 'px';
  }

  /* Activate tab from ?tab= query param (e.g. index.html?tab=about) */
  const urlTab = new URLSearchParams(window.location.search).get('tab');
  if (urlTab) {
    const target = document.querySelector(`.tab-btn[data-tab="${urlTab}"]`);
    if (target && target !== activeBtn) {
      tabs.forEach(t => t.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      target.classList.add('active');
      document.getElementById('panel-' + urlTab).classList.add('active');
      activeBtn = target;
    }
  }

  /* Position indicator immediately (no transition on first paint) */
  indicator.style.transition = 'none';
  moveIndicator(activeBtn);
  requestAnimationFrame(() => { indicator.style.transition = ''; });

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const switching = tab !== activeBtn;
      tabs.forEach(t => t.classList.remove('active'));
      panels.forEach(p => { p.classList.remove('active'); p.classList.remove('is-entering'); });
      const panel = document.getElementById('panel-' + tab.dataset.tab);
      tab.classList.add('active');
      panel.classList.add('active');
      // New tab starts from its beginning, directly under the tab bar. The page
      // scrolls the window; .content's top is 0 on desktop and just below the
      // stacked sidebar on mobile. Only scroll up, and do it in this same frame
      // (instant — overriding html's smooth scroll-behavior) so the new panel is
      // never painted at the old position.
      const contentTop = document.querySelector('.content').offsetTop;
      if (switching && window.scrollY > contentTop) {
        window.scrollTo({ top: contentTop, behavior: 'instant' });
      }
      void panel.offsetWidth; // force reflow so animation replays
      panel.classList.add('is-entering');
      activeBtn = tab;
      moveIndicator(tab);
    });

    tab.addEventListener('mouseenter', () => {
      if (tab !== activeBtn) moveIndicator(tab);
    });
  });

  tabsNav.addEventListener('mouseleave', () => moveIndicator(activeBtn));

  /* Career timeline tooltips — mouse hover, keyboard focus, or tap (touch).
     Content is copied from each bar's hidden .tl-tip-content (rendered from
     portfolio.json); the bar itself references it via aria-describedby, so the
     floating copy is aria-hidden. */
  function initTimelineTooltips(root) {
    const bars = root.querySelectorAll('.tl-bar[data-tip]');
    if (!bars.length) return;

    const tip = document.createElement('div');
    tip.className = 'tl-tooltip';
    tip.setAttribute('aria-hidden', 'true');
    document.body.appendChild(tip);

    const GAP = 10, EDGE = 8;
    let active = null;
    let lastPointer = 'mouse';

    function place() {
      const r = active.getBoundingClientRect();
      if (!r.width) return hide();   // bar no longer rendered (e.g. stacked mobile list)
      const w = tip.offsetWidth, h = tip.offsetHeight;
      // Keep clear of the sticky tab bar at the top of the viewport
      const topLimit = Math.max(EDGE, tabsNav.getBoundingClientRect().bottom + EDGE);
      const above = r.top - GAP - h;
      const below = r.bottom + GAP;
      // Prefer above; go below unless below would overflow and above has more room
      const fitsBelow = below + h <= innerHeight - EDGE;
      const top = above >= topLimit || (!fitsBelow && above - topLimit > innerHeight - EDGE - below - h) ? above : below;
      const left = Math.min(Math.max(r.left + r.width / 2 - w / 2, EDGE), innerWidth - w - EDGE);
      tip.style.setProperty('--tl-tip-shift', top === above ? '4px' : '-4px');
      tip.style.top = Math.round(top) + 'px';
      tip.style.left = Math.round(left) + 'px';
    }

    function show(bar) {
      if (active !== bar) {
        if (active) active.classList.remove('is-active');
        tip.innerHTML = document.getElementById(bar.dataset.tip).innerHTML;
        tip.style.setProperty('--tl-color', getComputedStyle(bar).getPropertyValue('--tl-color'));
        active = bar;
      }
      place();
      if (active) {
        active.classList.add('is-active');
        tip.classList.add('is-visible');
      }
    }

    function hide() {
      if (active) active.classList.remove('is-active');
      active = null;
      tip.classList.remove('is-visible');
    }

    bars.forEach(bar => {
      bar.addEventListener('pointerdown', e => { lastPointer = e.pointerType; });
      bar.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(bar); });
      bar.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && active === bar) hide(); });
      // Touch/pen tap toggles; Enter/Space toggles for keyboard users
      bar.addEventListener('click', e => {
        const type = e.pointerType !== undefined && e.pointerType !== '' ? e.pointerType : (e.detail === 0 ? 'keyboard' : lastPointer);
        if (type === 'mouse') return;
        active === bar ? hide() : show(bar);
      });
      bar.addEventListener('focus', () => { if (bar.matches(':focus-visible')) show(bar); });
      bar.addEventListener('blur', () => { if (active === bar) hide(); });
    });

    // Tap/click anywhere else closes it; Escape closes it
    document.addEventListener('pointerdown', e => {
      if (active && !e.target.closest('.tl-bar')) hide();
    }, true);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && active) hide(); });
    // Follow the bar while scrolling/resizing (listeners are passive — no scroll jank)
    const follow = () => { if (active) place(); };
    addEventListener('scroll', follow, { passive: true, capture: true });
    addEventListener('resize', follow, { passive: true });
  }

  /* Load portfolio data and render all dynamic content */
  document.addEventListener('DOMContentLoaded', async () => {
    const data = await fetch('data/portfolio.json').then(r => r.json());

    /* Sidebar */
    document.querySelector('.avatar').innerHTML             = Renderer.avatar(data.sidebar.avatar);
    document.querySelector('.sidebar__name').textContent    = data.sidebar.name;
    document.querySelector('.sidebar__title').innerHTML     = data.sidebar.titleLines.join('<br>');
    document.querySelector('.sidebar__tagline').textContent = data.sidebar.tagline;
    document.getElementById('sidebar-tags').innerHTML       = Renderer.tags(data.sidebar.tags);
    document.getElementById('sidebar-contact').innerHTML    = Renderer.contact(data.sidebar.contact);

    /* Work grid — respect showDrafts setting */
    const projectsToShow = data.showDrafts
      ? data.projects
      : data.projects.filter(p => p.status === 'live' || !p.status);
    document.getElementById('work-grid').innerHTML =
      projectsToShow.map(p => Renderer.projectCard(p)).join('');

    /* About */
    document.getElementById('about-body').innerHTML =
      data.about.paragraphs.map(p => `<p>${p}</p>`).join('');

    /* Career timeline — rendered entirely from data.about.timeline */
    const timelineEl = document.getElementById('about-timeline');
    timelineEl.innerHTML = Renderer.timeline(data.about.timeline);
    timelineEl.hidden = !timelineEl.innerHTML.trim();
    initTimelineTooltips(timelineEl);

    /* Publications — only Live articles are shown publicly. Date/read-time
       aren't stored on the publications list itself; each is fetched from
       the article's own JSON (same source of truth the article page reads)
       and run through the same Renderer.formatDate/readingTime it uses, so
       the two pages can't drift. A per-article failure (missing file, bad
       JSON, no publishedAt) just drops that article's metadata row —
       handled by Renderer.article() — rather than breaking the list. */
    const livePubs = data.publications.filter(pub => pub.status === 'live');
    const pubMetas = await Promise.all(livePubs.map(async pub => {
      try {
        const articleData = await fetch(`data/articles/${pub.id}.json`).then(r => r.json());
        return {
          date: Renderer.formatDate(articleData.publishedAt),
          readMins: Renderer.readingTime(articleData.body),
        };
      } catch (e) {
        return {};
      }
    }));
    document.getElementById('publications-list').innerHTML =
      livePubs.map((pub, i) => Renderer.article(pub, pubMetas[i])).join('');
  });
</script>

</body>
</html>
