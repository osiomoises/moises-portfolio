<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moises Osio — Product Designer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #111;
      min-height: 100vh;
    }

    /* Shared card hover look — Recommendations cards and Experience entries */
    :root {
      --card-border: #e5e7eb;
      --card-hover-shadow: 0 10px 28px rgba(17, 17, 17, 0.07), 0 2px 6px rgba(17, 17, 17, 0.04);
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 340px;
      min-width: 280px;
      padding: 48px 40px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #e5e7eb;
      margin-bottom: 8px;
      overflow: hidden;
      position: relative;
    }

    .avatar__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Optional hover avatar — stacked over the default photo, crossfades in on
       hover. Touch devices never match (hover: hover), so they keep the default. */
    .avatar__img--hover {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 300ms ease-in-out;
    }
    @media (hover: hover) {
      .avatar:hover .avatar__img--hover { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .avatar__img--hover { transition: none; }
    }

    .sidebar__name {
      font-size: 24px;
      font-weight: 600;
      color: #111;
      margin-bottom: 10px;
    }

    .sidebar__title {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: #000;
      margin-bottom: 20px;
    }

    .sidebar__tagline {
      font-size: 15px;
      line-height: 1.65;
      color: #444;
      margin-bottom: 28px;
    }

    .divider {
      border: none;
      border-top: 1px dashed #ccc;
      margin: 24px 0;
    }

    .focus-label {
      font-size: 13px;
      font-weight: 600;
      color: #111;
      margin-bottom: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      border: 1px solid #ccc;
      border-radius: 100px;
      padding: 4px 13px;
      font-size: 13px;
      color: #333;
    }

    /* Contact */
    .contact {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 14px;
      color: #333;
      text-decoration: none;
    }

    .contact-item svg {
      flex-shrink: 0;
      color: #555;
    }

    a.contact-item:hover { color: #000; }

    /* ── Main content ── */
    .content {
      margin-left: 340px;
      flex: 1;
      padding: 24px 56px 80px;
      min-height: 100vh;
    }

    /* ── Tabs ── */
    /* Sticky: 24px of the content's top padding lives here instead, so the
       resting position is unchanged and the stuck bar has breathing room. */
    .tabs {
      display: flex;
      gap: 24px;
      margin-bottom: 36px;
      padding-top: 24px;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      /* Side masks: hide the edge of a hovered card (scale 1.02 → ≤434px card
         grows ~4.3px per side) as it passes underneath. */
      box-shadow: -5px 0 0 #fff, 5px 0 0 #fff;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 0 0 14px;
      font-size: 15px;
      color: #888;
      cursor: pointer;
      font-family: inherit;
      font-weight: 400;
      transition: color 0.15s;
    }

    .tab-btn.active {
      color: #111;
      font-weight: 500;
    }

    .tabs__indicator {
      position: absolute;
      bottom: -1px;
      height: 2px;
      background: #111;
      pointer-events: none;
      transition: left 220ms cubic-bezier(.2,.8,.2,1), width 220ms cubic-bezier(.2,.8,.2,1);
    }

    @media (prefers-reduced-motion: reduce) {
      .tabs__indicator { transition: none; }
    }

    /* ── Entrance animations ── */
    @keyframes home-reveal {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .content { animation: home-reveal 0.7s ease both; }

    @keyframes tab-reveal {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .panel.is-entering { animation: tab-reveal 0.45s ease both; }

    @media (prefers-reduced-motion: reduce) {
      .content { animation: none; }
      .panel.is-entering { animation: none; }
    }

    /* ── Panels ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Work grid ── */
    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 434px));
      gap: 32px;
    }

    .project-card {
      border-radius: 10px;
      overflow: hidden;
      background: #f7f7f7;
      position: relative;
      display: block;
      text-decoration: none;
      transition: transform 0.3s ease;
    }

    .project-card:hover {
      transform: scale(1.02);
    }

    .project-card__draft-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #fef08a;
      color: #713f12;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      z-index: 2;
      pointer-events: none;
    }

    .project-card__image {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #e5e7eb;
      background-image:
        linear-gradient(45deg, #d1d5db 25%, transparent 25%),
        linear-gradient(-45deg, #d1d5db 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #d1d5db 75%),
        linear-gradient(-45deg, transparent 75%, #d1d5db 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      overflow: hidden;
    }

    .project-card__image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-card__hover-bg {
      position: absolute;
      inset: 0;
      background: var(--hover-bg, #111111);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .project-card:hover .project-card__hover-bg {
      opacity: 1;
    }

    .project-card__body {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 22px 24px;
      background: linear-gradient(to top, rgba(10,10,10,0.88) 0%, rgba(10,10,10,0.45) 55%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .project-card:hover .project-card__body {
      opacity: 1;
    }

    .project-card__title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.35;
      max-width: 92%;
      text-wrap: balance;
    }

    .project-card__subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .project-card__link {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* ── About ── */
    /* Typography comes from the shared headline rule in style.css */
    .about-heading { margin-bottom: 28px; }

    .about-body p {
      font-size: 17px;
      line-height: 1.75;
      color: #333;
      margin-bottom: 20px;
      max-width: 640px;
      /* Preserve line breaks typed in the editor's paragraph textarea,
         without requiring manual <br> tags — same technique already used
         for case-study/article paragraphs (see .cs-prose p.cs-paragraph
         in style.css). */
      white-space: pre-line;
    }

    /* ── Career & education ──
       Two columns (~30/70) once the section itself is wide enough — container
       query, so the fixed sidebar is accounted for; stacked below that.
       Current-position colours arrive from portfolio.json as CSS variables on
       .career (see Renderer.career); the values here are only fallbacks. */
    .career-section {
      container: career / inline-size;
      width: 100%;
      max-width: 880px;
    }

    /* About-tab sections (Recommendations, Background) each start with the
       same divider: 36px above, 1px line, 48px to the heading. */
    .recs,
    .career-section {
      margin-top: 36px;
      padding-top: 48px;
      border-top: 1px solid #e5e7eb;
    }

    .career {
      --career-current-bg: #F3F2FE;
      --career-muted: #6b6b6b;
      --career-line: #e5e7eb;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      row-gap: 40px;
    }

    @container career (min-width: 720px) {
      .career {
        grid-template-columns: minmax(0, 3fr) minmax(0, 7fr);
        column-gap: 48px;
      }
    }

    /* Columns start 28px below the section heading — same as Recommendations */
    .career__heading + .career { margin-top: 28px; }

    .career-edu,
    .career-list { list-style: none; }

    .career-edu__item {
      padding: 14px 0;
      border-bottom: 1px solid var(--career-line);
    }

    .career-edu__title {
      font-size: 16px;
      font-weight: 600;
      line-height: 22px;
      letter-spacing: -0.01em;
      color: #111;
    }

    .career-edu__sub {
      margin-top: 6px;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--career-muted);
    }

    .career-entry { border-bottom: 1px solid var(--career-line); }

    .career-entry__body { padding: 20px 18px; }

    /* Current position: tinted rounded card. No divider below it — the card
       separates itself; the 13px keeps the same gap the 12px + 1px divider gave. */
    .career-entry--current {
      padding-bottom: 13px;
      border-bottom: 0;
    }

    .career-entry--current .career-entry__body {
      background: var(--career-current-bg);
      border-radius: 12px;
    }

    /* Hover: the entry body becomes a Recommendations-style card. Default is
       unchanged (transparent; the radius is invisible). The 1px edge is a ring
       in box-shadow, not a border, so nothing changes size; only the body
       scales — the row (and its divider) stays put. */
    .career-entry__body {
      position: relative;
      border-radius: 12px;
      transition: transform 220ms ease, box-shadow 220ms ease, background-color 220ms ease;
    }

    @media (hover: hover) {
      /* Same hover card for every entry, Current included (1px stroke + shadow + scale) */
      .career-entry__body:hover {
        z-index: 1;
        transform: scale(1.01);
        box-shadow: 0 0 0 1px var(--card-border), var(--card-hover-shadow);
      }

      /* Plain entries turn white; the Current card keeps its lavender background */
      .career-entry:not(.career-entry--current) .career-entry__body:hover { background: #fff; }
    }

    @media (prefers-reduced-motion: reduce) {
      .career-entry__body { transition: none; }
      .career-entry__body:hover { transform: none !important; }   /* keep only the static card cue */
    }

    /* Job title is the heading; company sits under it */
    .career-entry__role {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: #111;
    }

    .career-entry__company {
      font-size: 16px;
      line-height: 1.45;
      color: #222;
    }

    .career-entry__role + .career-entry__company { margin-top: 2px; }

    /* Order: job title → company → dates → description */
    .career-entry__dates {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
      color: var(--career-muted);
    }

    .career-entry__desc {
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--career-muted);
    }

    .career-entry__desc strong { font-weight: 600; color: #333; }

    @container career (max-width: 719px) {
      .career-entry__body { padding: 18px 16px; }
    }

    /* Section headings: Recommendations and Background (career) share one style */
    .recs__heading,
    .career__heading {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #111;
    }

    .recs__subtitle {
      font-size: 17px;
      line-height: 1.6;
      color: #555;
      margin-top: 6px;
    }

    /* ── Recommendations ──
       Same width/left edge as the career section; two columns once the section
       itself is wide enough (container query, so the sidebar is accounted for). */
    .recs {
      container: recs / inline-size;
      width: 100%;
      max-width: 880px;
    }

    .recs__grid {
      --recs-gap: 20px;
      list-style: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--recs-gap);
      align-items: start;   /* natural, content-based card heights */
      margin-top: 28px;
    }

    /* Two-column masonry: 1px grid rows, and each card spans its own height
       plus the gap (set by initRecommendations). Grid auto-placement then puts
       each card, in editor order, into the earliest free spot — so cards stack
       directly under each other with no row-based gaps. Only switched on once
       the spans are set (.is-masonry), so without JS it's a plain grid. */
    @container recs (min-width: 680px) {
      .recs__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      /* each span includes a trailing gap — pull the last one back so the grid ends at its last card */
      .recs__grid.is-masonry { grid-auto-rows: 1px; row-gap: 0; margin-bottom: calc(-1 * var(--recs-gap)); }
    }

    .rec-card {
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px 24px 20px;
      background: #fff;
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    /* Subtle lift on real hover devices only. transform/box-shadow don't affect
       layout, so the masonry spans (measured from computed height) are untouched. */
    @media (hover: hover) {
      .rec-card:hover {
        position: relative;
        z-index: 1;
        transform: translateY(-3px) scale(1.01);
        box-shadow: var(--card-hover-shadow);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rec-card { transition: none; }
      .rec-card:hover { transform: none; }   /* keep only the static shadow cue */
    }

    .rec-card__header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .rec-avatar {
      position: relative;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f1f1;
      color: #555;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .rec-avatar__img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rec-card__who { min-width: 0; }

    .rec-card__name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      color: #111;
    }

    .rec-card__title {
      font-size: 13.5px;
      line-height: 1.45;
      color: #555;
    }

    .rec-card__relationship {
      font-size: 13px;
      line-height: 1.45;
      color: #6b6b6b;
    }

    .rec-card__text {
      margin-top: 16px;
      font-size: 15px;
      line-height: 1.7;
      color: #444;
      white-space: pre-line;   /* keeps paragraph breaks typed in the editor */
    }

    @container recs (max-width: 679px) {
      .rec-card { padding: 20px 20px 18px; }
    }

    /* ── Publications ── */
    /* Typography comes from the shared headline rule in style.css */
    .publications-heading { margin-bottom: 28px; }

    .publications-list {
      max-width: 900px;
    }

    .article {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding: 32px 0;
      border-bottom: 1px solid #e5e7eb;
      text-decoration: none;
      color: inherit;
    }

    .article:first-of-type { border-top: 1px solid #e5e7eb; }

    .article__body { flex: 1; }

    .article__title {
      font-size: 24px;
      font-weight: 700;
      color: #111;
      line-height: 1.4;
      margin-bottom: 10px;
      max-width: 480px;
      text-wrap: balance;
    }

    /* Date · read time — tertiary, sits between title and excerpt */
    .article__meta {
      font-size: 14px;
      color: #8a8a8a;
      margin-bottom: 10px;
    }

    .article__excerpt {
      font-size: 15px;
      color: #555;
      line-height: 1.65;
      margin-bottom: 16px;
      max-width: 520px;
    }

    .article__link {
      font-size: 14px;
      font-weight: 500;
      color: #3730a3;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      transition: gap var(--transition-fast);
    }

    .article:hover .article__link { gap: 0.65em; }

    .article__image {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .article__image-bg {
      width: 100%;
      height: 100%;
      background: #e5e7eb;
      transition: transform 0.5s ease;
    }

    .article__image-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .article__image:hover .article__image-bg { transform: scale(1.05); }

    /* ── Mobile: single-column layout ── */
    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
      }

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        overflow-y: visible;
        padding: 32px 24px 0;
      }

      .content {
        margin-left: 0;
        padding: 0 24px 64px;
      }

      .tabs {
        margin-top: 16px;
        padding-top: 24px;
        /* Full-width cards (≤720px here) grow up to ~7.2px per side on hover */
        box-shadow: -8px 0 0 #fff, 8px 0 0 #fff;
      }

      /* Prevent overflow on work grid */
      .work-grid {
        grid-template-columns: 1fr;
      }

      /* Publication rows: 80px thumb on left, text on right */
      .article {
        gap: 16px;
        justify-content: flex-start;
      }

      .article__image {
        order: -1;
        width: 80px;
        height: 80px;
        min-width: 80px;
        border-radius: 8px;
        align-self: flex-start;
      }

      .article__excerpt {
        max-width: none;
      }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="sidebar">

    <div class="avatar"></div>

    <p class="sidebar__name"></p>
    <h1 class="sidebar__title"></h1>
    <p class="sidebar__tagline"></p>

    <hr class="divider">

    <p class="focus-label">Focus:</p>
    <div class="tags" id="sidebar-tags"></div>

    <hr class="divider">

    <div class="contact" id="sidebar-contact"></div>

  </aside>

  <!-- ══════════ MAIN CONTENT ══════════ -->
  <main class="content">

    <!-- Tab nav -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="work">Selected work</button>
      <button class="tab-btn" data-tab="about">About me</button>
      <button class="tab-btn" data-tab="publications">Publications</button>
      <span class="tabs__indicator" aria-hidden="true"></span>
    </nav>

    <!-- ── Panel: Selected work ── -->
    <div class="panel active" id="panel-work">
      <div class="work-grid" id="work-grid"></div>
    </div>

    <!-- ── Panel: About me ── -->
    <div class="panel" id="panel-about">
      <h2 class="about-heading" id="about-heading">About Me</h2>
      <div class="about-body" id="about-body"></div>
      <section class="recs" id="about-recommendations" aria-labelledby="recs-heading" hidden></section>
      <section class="career-section" id="about-career" aria-labelledby="career-heading" hidden></section>
    </div>

    <!-- ── Panel: Publications ── -->
    <div class="panel" id="panel-publications">
      <h2 class="publications-heading" id="publications-heading">Publications</h2>
      <div class="publications-list" id="publications-list"></div>
    </div>

  </main>
</div>

<script src="renderer.js"></script>
<script>
  /* Tab switching with sliding underline indicator */
  const tabs      = document.querySelectorAll('.tab-btn');
  const panels    = document.querySelectorAll('.panel');
  const indicator = document.querySelector('.tabs__indicator');
  const tabsNav   = document.querySelector('.tabs');
  let activeBtn   = document.querySelector('.tab-btn.active');

  function moveIndicator(btn) {
    const navRect = tabsNav.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    indicator.style.left  = (btnRect.left - navRect.left) + 'px';
    indicator.style.width = btnRect.width + 'px';
  }

  /* Activate tab from ?tab= query param (e.g. index.html?tab=about) */
  const urlTab = new URLSearchParams(window.location.search).get('tab');
  if (urlTab) {
    const target = document.querySelector(`.tab-btn[data-tab="${urlTab}"]`);
    if (target && target !== activeBtn) {
      tabs.forEach(t => t.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      target.classList.add('active');
      document.getElementById('panel-' + urlTab).classList.add('active');
      activeBtn = target;
    }
  }

  /* Position indicator immediately (no transition on first paint) */
  indicator.style.transition = 'none';
  moveIndicator(activeBtn);
  requestAnimationFrame(() => { indicator.style.transition = ''; });

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const switching = tab !== activeBtn;
      tabs.forEach(t => t.classList.remove('active'));
      panels.forEach(p => { p.classList.remove('active'); p.classList.remove('is-entering'); });
      const panel = document.getElementById('panel-' + tab.dataset.tab);
      tab.classList.add('active');
      panel.classList.add('active');
      // New tab starts from its beginning, directly under the tab bar. The page
      // scrolls the window; .content's top is 0 on desktop and just below the
      // stacked sidebar on mobile. Only scroll up, and do it in this same frame
      // (instant — overriding html's smooth scroll-behavior) so the new panel is
      // never painted at the old position.
      const contentTop = document.querySelector('.content').offsetTop;
      if (switching && window.scrollY > contentTop) {
        window.scrollTo({ top: contentTop, behavior: 'instant' });
      }
      void panel.offsetWidth; // force reflow so animation replays
      panel.classList.add('is-entering');
      activeBtn = tab;
      moveIndicator(tab);
    });

    tab.addEventListener('mouseenter', () => {
      if (tab !== activeBtn) moveIndicator(tab);
    });
  });

  tabsNav.addEventListener('mouseleave', () => moveIndicator(activeBtn));

  /* Recommendations: avatar fallback + two-column masonry.
     In two columns each card spans (its height + gap) 1px grid rows; see
     .recs__grid.is-masonry. Heights can only be measured while the About panel
     is visible, so a ResizeObserver re-runs this when the section gets a size
     (tab shown), its width changes, or a card reflows (fonts, avatar load). */
  function initRecommendations(root) {
    root.querySelectorAll('.rec-avatar__img').forEach(img => {
      const drop = () => img.remove();   // reveals the initials underneath
      if (img.complete && !img.naturalWidth) drop();
      else img.addEventListener('error', drop);
    });

    const grid = root.querySelector('.recs__grid');
    if (!grid) return;
    const cards = [...grid.children];

    function layout() {
      if (!grid.offsetParent) return;   // panel hidden — nothing to measure yet
      const twoColumns = getComputedStyle(grid).gridTemplateColumns.split(' ').length > 1;
      if (!twoColumns) {
        grid.classList.remove('is-masonry');
        cards.forEach(c => { c.style.gridRowEnd = ''; });
        return;
      }
      const gap = parseFloat(getComputedStyle(grid).getPropertyValue('--recs-gap')) || 20;
      cards.forEach(c => {
        // computed height = layout height (fractional), unaffected by the hover transform
        c.style.gridRowEnd = `span ${Math.ceil(parseFloat(getComputedStyle(c).height) + gap)}`;
      });
      grid.classList.add('is-masonry');
    }

    const ro = new ResizeObserver(layout);
    ro.observe(root);
    cards.forEach(c => ro.observe(c));
  }

  /* Load portfolio data and render all dynamic content */
  document.addEventListener('DOMContentLoaded', async () => {
    const data = await fetch('data/portfolio.json').then(r => r.json());

    /* Sidebar */
    document.querySelector('.avatar').innerHTML             = Renderer.avatar(data.sidebar.avatar, data.sidebar.avatarHover);
    /* A broken hover image is dropped so hovering leaves the avatar unchanged */
    document.querySelector('.avatar__img--hover')?.addEventListener('error', e => e.target.remove());
    document.querySelector('.sidebar__name').textContent    = data.sidebar.name;
    document.querySelector('.sidebar__title').innerHTML     = data.sidebar.titleLines.join('<br>');
    document.querySelector('.sidebar__tagline').textContent = data.sidebar.tagline;
    document.getElementById('sidebar-tags').innerHTML       = Renderer.tags(data.sidebar.tags);
    document.getElementById('sidebar-contact').innerHTML    = Renderer.contact(data.sidebar.contact);

    /* Work grid — respect showDrafts setting */
    const projectsToShow = data.showDrafts
      ? data.projects
      : data.projects.filter(p => p.status === 'live' || !p.status);
    document.getElementById('work-grid').innerHTML =
      projectsToShow.map(p => Renderer.projectCard(p)).join('');

    /* About — heading falls back to the default text in the markup */
    if (data.about.title) document.getElementById('about-heading').textContent = data.about.title;
    if (data.publicationsTitle) document.getElementById('publications-heading').textContent = data.publicationsTitle;
    document.getElementById('about-body').innerHTML =
      data.about.paragraphs.map(p => `<p>${p}</p>`).join('');

    /* Career & education — rendered entirely from data.about.career */
    const careerEl = document.getElementById('about-career');
    careerEl.innerHTML = Renderer.career(data.about.career);
    careerEl.hidden = !careerEl.innerHTML.trim();

    /* Recommendations — rendered entirely from data.about.recommendations */
    const recsEl = document.getElementById('about-recommendations');
    recsEl.innerHTML = Renderer.recommendations(data.about.recommendations);
    recsEl.hidden = !recsEl.innerHTML.trim();
    initRecommendations(recsEl);

    /* Publications — only Live articles are shown publicly. Date/read-time
       aren't stored on the publications list itself; each is fetched from
       the article's own JSON (same source of truth the article page reads)
       and run through the same Renderer.formatDate/readingTime it uses, so
       the two pages can't drift. A per-article failure (missing file, bad
       JSON, no publishedAt) just drops that article's metadata row —
       handled by Renderer.article() — rather than breaking the list. */
    const livePubs = data.publications.filter(pub => pub.status === 'live');
    const pubMetas = await Promise.all(livePubs.map(async pub => {
      try {
        const articleData = await fetch(`data/articles/${pub.id}.json`).then(r => r.json());
        return {
          date: Renderer.formatDate(articleData.publishedAt),
          readMins: Renderer.readingTime(articleData.body),
        };
      } catch (e) {
        return {};
      }
    }));
    document.getElementById('publications-list').innerHTML =
      livePubs.map((pub, i) => Renderer.article(pub, pubMetas[i])).join('');
  });
</script>

</body>
</html>
